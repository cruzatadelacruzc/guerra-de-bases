<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="pwaBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="60%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#05080e"/>
    </radialGradient>

    <!-- Deep Core Glow -->
    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter Glow -->
    <filter id="glow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full bleed background for Android Adaptive/Maskable safe zone (central 66% ~ 340px circle) -->
  <rect width="512" height="512" fill="url(#pwaBg)"/>

  <!-- Radar concentric circles within safe area -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.08"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.2"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="120" fill="url(#coreAura)"/>

  <!-- Sub-radar cross lines -->
  <line x1="256" y1="65" x2="256" y2="447" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <line x1="65" y1="256" x2="447" y2="256" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 6"/>

  <!-- Tactical Outer Frame: The Nexo Stronghold Shield (Hexagon Fortress) -->
  <polygon points="256,92 398,174 398,338 256,420 114,338 114,174" fill="#0d1422" stroke="#00f0ff" stroke-width="12" stroke-linejoin="round" filter="url(#glow192)"/>

  <!-- Internal Armor Plating with Bevel -->
  <polygon points="256,122 368,187 368,325 256,390 144,325 144,187" fill="#131c2d" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.5" stroke-linejoin="round"/>

  <!-- Power Conduits converging to center -->
  <line x1="256" y1="122" x2="256" y2="206" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="368" y1="187" x2="299" y2="227" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="368" y1="325" x2="299" y2="285" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="390" x2="256" y2="306" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="144" y1="325" x2="213" y2="285" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="144" y1="187" x2="213" y2="227" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>

  <!-- Nexus Central Energy Core -->
  <circle cx="256" cy="256" r="46" fill="#00f0ff" filter="url(#glow192)"/>
  <circle cx="256" cy="256" r="22" fill="#ffffff"/>

  <!-- Tactical Gold Nodes (Amber Currency / Power Sockets) -->
  <circle cx="256" cy="150" r="9" fill="#ffd000"/>
  <circle cx="340" cy="199" r="9" fill="#ffd000"/>
  <circle cx="340" cy="303" r="9" fill="#ffd000"/>
  <circle cx="256" cy="352" r="9" fill="#ffd000"/>
  <circle cx="172" cy="303" r="9" fill="#ffd000"/>
  <circle cx="172" cy="199" r="9" fill="#ffd000"/>

  <!-- Tactical Sci-fi corner brackets -->
  <path d="M 60 90 L 60 60 L 90 60" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M 452 90 L 452 60 L 422 60" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M 60 422 L 60 452 L 90 452" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M 452 422 L 452 452 L 422 452" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>
