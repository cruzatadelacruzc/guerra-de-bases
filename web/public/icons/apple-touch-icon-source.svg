<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS squircle canvas background -->
  <rect width="180" height="180" fill="url(#bgGrad)"/>

  <!-- Subtly textured tactical cyber grid -->
  <circle cx="90" cy="90" r="76" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="90" cy="90" r="58" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity="0.25"/>
  <circle cx="90" cy="90" r="38" fill="url(#cyanGlow)"/>

  <!-- Tactical Crosshairs / Corner brackets -->
  <path d="M 28 42 L 28 28 L 42 28" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 152 42 L 152 28 L 138 28" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 28 138 L 28 152 L 42 152" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 152 138 L 152 152 L 138 152" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Hexagonal Bastion Exterior Structure -->
  <polygon points="90,26 142,56 142,116 90,146 38,116 38,56" fill="#0d1422" stroke="#00f0ff" stroke-width="5" stroke-linejoin="round" filter="url(#neonBlur)"/>

  <!-- Sub-frame armor shields -->
  <polygon points="90,38 132,62 132,110 90,134 48,110 48,62" fill="#131c2d" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.4" stroke-linejoin="round"/>

  <!-- Tactical Energy conduits linking to core -->
  <path d="M90 38 L90 70 M132 62 L105 77 M132 110 L105 103 M90 134 L90 110 M48 110 L75 103 M48 62 L75 77" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Central Nexus Core with White-hot center -->
  <circle cx="90" cy="90" r="18" fill="#00f0ff" filter="url(#neonBlur)"/>
  <circle cx="90" cy="90" r="8" fill="#ffffff"/>

  <!-- Tactical Amber Power Points (Gold nodes) -->
  <circle cx="90" cy="48" r="4" fill="#ffd000"/>
  <circle cx="122" cy="67" r="4" fill="#ffd000"/>
  <circle cx="122" cy="105" r="4" fill="#ffd000"/>
  <circle cx="90" cy="124" r="4" fill="#ffd000"/>
  <circle cx="58" cy="105" r="4" fill="#ffd000"/>
  <circle cx="58" cy="67" r="4" fill="#ffd000"/>
</svg>
